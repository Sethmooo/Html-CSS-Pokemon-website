<!DOCTYPE html>
<html lang="en">
<!-- Seth Moore -->
<head>
	<title>Pokemon Interactive Map</title>
	<meta charset="utf-8">
	<link rel="stylesheet" href="css/styles.css">
	
	<!-- The line below will scale for a mobile phone -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="First build of the Pokemon website, this website includes everything I have learned about web development this semester">
	
                
	
	<style>
	
	
	body, header, nav, main, footer, img{
		margin: 0;
		padding: 0;
		border: 0;
	
	}
	
	body{
		background-color: #eeeeee;
	}
	
	main p{
		text-align: center;
		font-family: Verdana, Arial, sans-serif;
		font-size: 0.8em;
		
	}
		
		
	.hamburger {
		display: block;
		font-size: 2em;
		cursor: pointer;
		background: none;
		border: none;
		padding: 10px;
	}
	
	#hamburger.active{
		transform: rotate(90deg);
		transition: transform 0.3s ease;
	}
	
	
	#nav-links {
		display: none;
		text-align: center;
	}
	
	#nav-links.active {
		display: block;
	}
		
		
	
	nav p a{
		display: inline-block;
		color: #000000;
		padding: 0.3em 0.7em;
		text-decoration: none;
	}
	
	.center{ 
		margin-left: auto;
		margin-right: auto;
		max-height: 90%;
		max-width: 90%;
	}
	
	.center:hover{ 
		transform: scale(1.5, 1.5);
	}
	
	
	
	footer{
		text-align: center;
		font-size: 0.85em;
		background-color: #eeeeee;
		color: #000000;
		padding: 1% 0;
	
	}
	
	footer img {
    width: 40px; 
    transition: transform 0.3s ease;
	}
	
	footer img:hover {
		transform: scale(1.1)
	}

	.mobile{
		display: block;
		
	}
	.tablet-desktop {
		display: none;
	}
	
	
	@media screen and (min-width: 630px){
	
	.tablet-desktop{
		display: block;
	}
		
	.mobile{
		display: none;
		
	}
		
	.center{ 
		margin-left: auto;
		margin-right: auto;
		max-height: 90%;
		max-width: 90%;
	}
	
	.center:hover{ 
		transform: none;
	}
	
	.hamburger {
		display: none;
	}
	
	#nav-links {
		display: block;
	}
	
	#nav-links.active {
		display: block;
	}
	
	
		
	}
	
	@media screen and (min-width: 1280px){
		
	.center{ 
		margin-left: auto;
		margin-right: auto;
		max-height: 45%;
		max-width: 45%;
	}
	
		
		
	}
	
	</style>
	
	
</head>

<body>
	
		<nav>
		
			<button class="hamburger" id="hamburger">
				&#9776;
			</button>
		
		
		
			<p id="nav-links">
			<a href="index.html">Home</a>  
			<a href="tmItems.html">Tm Items</a> 
			</p>
			
		</nav>
		
		<main> 
		
		<div class="mobile">
		
			<a href="routes.html"><img src="images/Kanto_Map_Overview.png" alt="Full Kanto Map" class="center"></a>
			<!--  Food for thought: I could break up each route on the overall map into thier own separate routes
				  which I may need to end up doing down the road but for now I think we should have it to where it has 
				  a hyperlink. The ladder might take too long plus that would be a lot of webpages to create there is probaly an
				  easier way of doing that so for now I will just have it send me to a routes page but this will 100% change
				  as I learn more. -->
			
		</div>
		
			
		
			<div class="tablet-desktop">
			
				<p>If you are seeing this then that means that I have applies breakpoints for tablet and desktop successfully!</p>
				
				<a href="routes.html"><img src="images/Kanto_Map_Overview.png" alt="Full Kanto Map" class="center"></a>
				<!-- Same image as above we want to change the size depending on what screen we are on! -->
			
			</div>
			
			
			
		</main>
		
		
		<footer>
		
			<p>&copy; Copyright 2026. All Rights Reserved.</p>
			<div class="social-links">
				<a href="https://www.linkedin.com/in/seth-moore-288a19390/">
					<img src="images/InBug-Black.png" alt="LinkedIn Profile">
				</a>
			</div>
			
		</footer>
		
	<script src="scripts/script.js"></script>
</body>

</html>
